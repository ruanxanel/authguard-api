services:
  postgres:
    image: postgres:17
    container_name: authguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - authguard_data:/var/lib/postgresql/data

volumes:
  authguard_data: