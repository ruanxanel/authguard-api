spring:
  application:
    name: authguard

  datasource:
    url: jdbc:postgresql://localhost:5434/authguard_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-api: https://pkrpihbdbtqcjhvwbknm.supabase.co/auth/v1
          jwk-set-uri: https://pkrpihbdbtqcjhvwbknm.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms:
            - ES256
          audiences:
            - authenticated